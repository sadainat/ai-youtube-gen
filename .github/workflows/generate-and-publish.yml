name: Generate and publish Arabic video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: arabic-video-publisher
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create YouTube OAuth credentials
        env:
          YOUTUBE_CREDENTIALS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS_JSON }}
        run: |
          test -n "$YOUTUBE_CREDENTIALS_JSON" || { echo "YOUTUBE_CREDENTIALS_JSON is not configured"; exit 1; }
          printf '%s' "$YOUTUBE_CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json')); print('YouTube credentials JSON is valid')"

      - name: Run generator and publishers
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GEMINI_MODEL: gemini-3.6-flash
          ARABIC_VOICE: ar-SA-HamedNeural
        run: |
          test -n "$GOOGLE_API_KEY" || { echo "GOOGLE_API_KEY is not configured"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY is not configured"; exit 1; }
          test -n "$FACEBOOK_PAGE_ID" || { echo "FACEBOOK_PAGE_ID is not configured"; exit 1; }
          test -n "$FACEBOOK_PAGE_ACCESS_TOKEN" || { echo "FACEBOOK_PAGE_ACCESS_TOKEN is not configured"; exit 1; }
          set -o pipefail
          python -u main.py 2>&1 | tee github-actions.log

      - name: Save content plan progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_plan.json
          git diff --cached --quiet || git commit -m "Update published content plan"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: |
            github-actions.log
            output/content/
            output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

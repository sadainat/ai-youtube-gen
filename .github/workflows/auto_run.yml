name: AI Video Publisher
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  publish_video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          REQUIRE_REAL_VIDEO: 'true'
          REQUIRE_FACEBOOK_UPLOAD: 'true'
        run: |
          test -n "$GOOGLE_API_KEY" || { echo "GOOGLE_API_KEY is not configured"; exit 1; }
          test -n "$PEXELS_API_KEY" || { echo "PEXELS_API_KEY is not configured. Add it in Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$FACEBOOK_PAGE_ID" || { echo "FACEBOOK_PAGE_ID is not configured"; exit 1; }
          test -n "$FACEBOOK_PAGE_ACCESS_TOKEN" || { echo "FACEBOOK_PAGE_ACCESS_TOKEN is not configured"; exit 1; }
          test -n "${{ secrets.YOUTUBE_CREDENTIALS_JSON }}" || { echo "YOUTUBE_CREDENTIALS_JSON is not configured"; exit 1; }
          printf '%s' '${{ secrets.YOUTUBE_CREDENTIALS_JSON }}' > credentials.json
          python main.py
